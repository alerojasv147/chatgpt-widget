name: Deploy Widget

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build widget
        run: npm run build
        # Genera dist/index.html con todo JS/CSS inline gracias a vite-plugin-singlefile.
        # Este único archivo es lo que el MCP server descargará vía HTTP.

      - name: Rename output for cleaner URL
        run: |
          cp dist/index.html dist/hello.html
        # El MCP server pedirá GET /hello.html
        # La URL final será: https://<org>.github.io/<repo>/hello.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - uses: actions/deploy-pages@v4
        id: deployment
